$kind: http-request
method: GET
url: "{{base_url}}/api/accounts"
order: 1000
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 200", function () {
          pm.response.to.have.status(200);
      });

      pm.test("Response is an object", function () {
          pm.response.to.be.json;
          pm.expect(pm.response.json()).to.be.an('object');
      });
